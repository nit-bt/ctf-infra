<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CTFC Live · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --night: #1a1424; --night-2: #241b31; --night-3: #2f2440; --line: #3d3050;
  --plum: #6b2d5c; --red: #d0603a; --blue: #4a7fe6; --cream: #f4f5ed; --muted: #b4aac0; --dim: #7d7290;
  --px: 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--cream);
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
main { width: min(380px, 100%); }
h1 { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 20px; margin: 0 0 6px; letter-spacing: 0; }
h1 b { color: var(--red); font-weight: 400; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
form { --s: var(--px); background: var(--night-2); padding: 22px 22px 20px; border-top: var(--px) solid var(--red);
  clip-path: polygon(0 var(--s),var(--s) var(--s),var(--s) 0,calc(100% - var(--s)) 0,calc(100% - var(--s)) var(--s),100% var(--s),100% calc(100% - var(--s)),calc(100% - var(--s)) calc(100% - var(--s)),calc(100% - var(--s)) 100%,var(--s) 100%,var(--s) calc(100% - var(--s)),0 calc(100% - var(--s))); }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
input { display: block; width: 100%; margin-top: 5px; font: inherit; font-size: 16px; color: var(--cream);
  background: var(--night); border: 1px solid var(--line); padding: 10px 12px; }
input:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
button { width: 100%; margin-top: 6px; font: inherit; font-weight: 700; font-size: 16px; color: var(--cream);
  background: var(--red); border: 0; padding: 11px; cursor: pointer; }
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.err { background: #3a1d24; color: #ffb4a3; border-left: 3px solid var(--red); padding: 9px 12px; font-size: 14px; margin: 0 0 16px; }
.foot { color: var(--dim); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>CTFC <b>LIVE</b></h1>
  <p class="sub">Organizers only. Server status for the CTF.</p>
  <form method="post" action="login" autocomplete="on">
    {{ERROR}}
    <label>Username <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="foot">5 wrong tries locks your network out for 15 minutes.</p>
</main>
</body>
</html>
