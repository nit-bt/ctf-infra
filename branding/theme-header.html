<script>
/* Pixel confetti when a flag is accepted. Watches CTFd's attempt API, no plugin needed. */
(function () {
  var COLORS = ["#b5532e", "#3a6fd8", "#f4f5ed", "#8f3d7b", "#e07a4f", "#6f9cf0"];
  function burst() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.createElement("canvas"), x = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
    var W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:10000";
    document.body.appendChild(c); x.scale(dpr, dpr);
    var bits = [];
    [[0, H, 1], [W, H, -1]].forEach(function (o) {           // two cannons, bottom corners
      for (var i = 0; i < 90; i++) {
        var a = (55 + Math.random() * 30) * Math.PI / 180, v = 11 + Math.random() * 9;
        bits.push({ x: o[0], y: o[1], vx: Math.cos(a) * v * o[2], vy: -Math.sin(a) * v,
          s: 4 * (1 + (Math.random() * 3 | 0)), c: COLORS[Math.random() * COLORS.length | 0],
          f: Math.random() * 6 });
      }
    });
    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0; x.clearRect(0, 0, W, H);
      bits.forEach(function (b) {
        b.vy += 0.32; b.vx *= 0.985; b.vy *= 0.985; b.x += b.vx; b.y += b.vy; b.f += 0.25;
        var w = Math.max(2, Math.round(Math.abs(Math.cos(b.f)) * b.s / 2) * 2);   // flip, in whole pixels
        x.globalAlpha = age > 2200 ? Math.max(0, 1 - (age - 2200) / 600) : 1;
        x.fillStyle = b.c; x.fillRect(Math.round(b.x), Math.round(b.y), w, b.s);
      });
      if (age < 2800) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }
  function popup() {
    var win = document.querySelector("#challenge-window");
    var name = win && win.querySelector(".challenge-name"), pts = win && win.querySelector(".challenge-value");
    var d = document.createElement("div");
    d.className = "ctfc-win"; d.setAttribute("role", "status");
    d.innerHTML = '<div class="ctfc-win-box"><div class="ctfc-win-title">Flag captured!</div>' +
      '<div class="ctfc-win-name"></div><div class="ctfc-win-pts"></div>' +
      '<button type="button" class="btn ctfc-win-ok">Nice</button></div>';
    fetch("/api/v1/docker_memes", { credentials: "same-origin", headers: { "Content-Type": "application/json" } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var list = (j && j.data && j.data.solved_list) || [];
        if (!list.length || !d.isConnected) return;
        var img = new Image(); img.alt = ""; img.className = "ctfc-win-meme";
        img.onerror = function () { img.remove(); };
        img.src = list[Math.random() * list.length | 0];
        d.querySelector(".ctfc-win-title").after(img);
      }).catch(function () {});
    d.querySelector(".ctfc-win-name").textContent = name ? name.textContent.trim() : "";
    d.querySelector(".ctfc-win-pts").textContent = pts ? "+" + pts.textContent.trim().replace(/\s*pts$/i, "") + " pts" : "";
    var close = function () { d.remove(); document.removeEventListener("keydown", esc); };
    var esc = function (e) { if (e.key === "Escape" || e.key === "Enter") close(); };
    d.addEventListener("click", close); document.addEventListener("keydown", esc);
    document.body.appendChild(d); d.querySelector(".ctfc-win-ok").focus();
    setTimeout(close, 6000);
  }
  window.ctfcConfetti = burst;
  window.ctfcWin = function () { popup(); burst(); };
  var f = window.fetch;
  window.fetch = function (input, init) {
    var p = f.apply(this, arguments), url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/v1/challenges/attempt") !== -1) {
      p.then(function (r) { return r.clone().json(); })
       .then(function (j) { if (j && j.data && j.data.status === "correct") { popup(); burst(); } })
       .catch(function () {});
    }
    return p;
  };
})();
</script>
